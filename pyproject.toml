[project]
name = "youtdown"
version = "0.1.0"
description = "Download YouTube audio as MP3 from the command line"
readme = "README.md"
authors = [
    { name = "pedrosanto90", email = "pedro.bb.90@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "yt-dlp>=2026.8.19",
]

[project.scripts]
youtdown = "youtdown:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
